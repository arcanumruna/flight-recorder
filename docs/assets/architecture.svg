<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="How flight-recorder records: instrumented sites on any thread write completed spans into that thread's own ring; a drainer moves them off the hot path into per-thread tapes; reports are per-site histograms, a Chrome trace, a raw tape and run metadata.">
  <defs>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a855f7"/></marker>
  </defs>
  <rect width="1200" height="400" rx="22" fill="#06060a"/>
  <rect x=".5" y=".5" width="1199" height="399" rx="21.5" fill="none" stroke="#a885f7" stroke-opacity=".22"/>
  <text x="600" y="36" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="4" fill="#7a7a92">HOT PATH (EVERY THREAD) → COLD PATH (ONE DRAINER)</text>
  <rect x="30" y="90" width="200" height="130" rx="16" fill="#0d0d16" stroke="#a885f7" stroke-opacity=".3" stroke-width="1"/>
  <text x="130.0" y="124" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#edecf5">Sites</text>
  <text x="130.0" y="150" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#a3a3b8">SPAN · MARK · SLOW_SPAN</text>
  <text x="130.0" y="171" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#7a7a92">THROTTLED · Event</text>
  <text x="130.0" y="192" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#7a7a92">146 static ids, 7 categories</text>
  <rect x="290" y="90" width="200" height="130" rx="16" fill="#0d0d16" stroke="url(#hot)" stroke-opacity="1" stroke-width="1.6"/>
  <text x="390.0" y="124" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#edecf5">Per-thread ring</text>
  <text x="390.0" y="150" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#a3a3b8">one per thread, 32-byte</text>
  <text x="390.0" y="171" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#7a7a92">records, one producer</text>
  <text x="390.0" y="192" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#7a7a92">drop-on-full, counted</text>
  <rect x="550" y="90" width="200" height="130" rx="16" fill="#0d0d16" stroke="#a885f7" stroke-opacity=".3" stroke-width="1"/>
  <text x="650.0" y="124" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#edecf5">Drainer</text>
  <text x="650.0" y="150" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#a3a3b8">background thread or</text>
  <text x="650.0" y="171" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#7a7a92">drainAndView() on report</text>
  <text x="650.0" y="192" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#7a7a92">calibrated TSC to ns</text>
  <rect x="810" y="90" width="170" height="130" rx="16" fill="#0d0d16" stroke="#a885f7" stroke-opacity=".3" stroke-width="1"/>
  <text x="895.0" y="124" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#edecf5">Tape</text>
  <text x="895.0" y="150" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#a3a3b8">per-thread, bounded</text>
  <text x="895.0" y="171" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#7a7a92">newest 2M records</text>
  <text x="895.0" y="192" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#7a7a92">kept per run</text>
  <rect x="1030" y="40" width="140" height="60" rx="16" fill="#0d0d16" stroke="#a885f7" stroke-opacity=".3" stroke-width="1"/>
  <text x="1100.0" y="74" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#edecf5">hist.txt</text>
  <rect x="1030" y="115" width="140" height="60" rx="16" fill="#0d0d16" stroke="#a885f7" stroke-opacity=".3" stroke-width="1"/>
  <text x="1100.0" y="149" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#edecf5">trace.json</text>
  <rect x="1030" y="190" width="140" height="60" rx="16" fill="#0d0d16" stroke="#a885f7" stroke-opacity=".3" stroke-width="1"/>
  <text x="1100.0" y="224" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#edecf5">tape.bin</text>
  <rect x="1030" y="265" width="140" height="60" rx="16" fill="#0d0d16" stroke="#a885f7" stroke-opacity=".3" stroke-width="1"/>
  <text x="1100.0" y="299" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#edecf5">meta.json</text>
  <line x1="236" y1="155" x2="284" y2="155" stroke="#a855f7" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="496" y1="155" x2="544" y2="155" stroke="#a855f7" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="756" y1="155" x2="804" y2="155" stroke="#a855f7" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="986" y1="150" x2="1024" y2="75" stroke="#a855f7" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="986" y1="155" x2="1024" y2="145" stroke="#a855f7" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="986" y1="160" x2="1024" y2="220" stroke="#a855f7" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="986" y1="165" x2="1024" y2="295" stroke="#a855f7" stroke-width="2" marker-end="url(#ar)"/>
  <text x="260" y="262" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#7a7a92">enabled(): relaxed load + branch</text>
  <text x="390" y="284" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#7a7a92">begin() / commit(): rdtscp, one ring push</text>
  <text x="650" y="262" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#7a7a92">off the hot path</text>
  <text x="600" y="368" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#a3a3b8">dumpAll(dir, suffix, role, node) writes the four files; SIGUSR1 or shutdown in the Rune broker</text>
</svg>
